<text class="label" x="362" y="95" text-anchor="middle">次卧2</text><text class="label" x="155" y="92" text-anchor="middle">次卧1</text><text class="label" x="126" y="373" text-anchor="middle">客卫</text><text class="label" x="228" y="369" text-anchor="middle">过道</text><text class="label" x="673" y="351" text-anchor="middle">玄关</text><text class="label" x="675" y="451" text-anchor="middle">储藏间</text><text class="label" x="138" y="465" text-anchor="middle">主卫</text><text class="label" x="137" y="578" text-anchor="middle">主卧</text><text class="label" x="721" y="577" text-anchor="middle">次卧3</text><text class="label" x="423" y="376" text-anchor="middle">客餐厅</text><text class="label" x="517" y="820" text-anchor="middle">南向大露台</text><text x="748" y="360" font-size="12" fill="#af6545">入户 →</text><text x="272" y="579" font-size="12" fill="#af6545">主卧门</text><text x="233" y="526" font-size="12" fill="#af6545">主卫门 ↓</text><text x="0" y="982" font-size="13">蓝虚线：可关闭玻璃边界候选；岛台缩为1600mm，通道不满足时取消独立岛台。</text>
<g id="pet-friendly-design-v1" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif">
  <!-- Existing polygons, walls, windows and door positions below are untouched. -->
  <rect x="872" y="-84" width="462" height="1092" rx="22" fill="#f7f9f5"/>
  <text x="896" y="-44" font-size="13" font-weight="800" fill="#43836e" letter-spacing="2">HOMEPLANER / 宠物友好概念方案</text>
  <text x="896" y="-10" font-size="27" font-weight="800" fill="#294a3d">让小狗融入日常生活</text>
  <text x="897" y="16" font-size="14" fill="#637f70">结构取自仓库当前版；不重绘房间与门洞</text>
  <path d="M 895 33 H 1312" stroke="#dae6dd" stroke-width="2"/>
  <g><circle cx="907" cy="70" r="15" fill="#d28b55"/><text x="907" y="76" text-anchor="middle" font-size="15" fill="#fff" font-weight="800">1</text><text x="935" y="73" font-size="19" fill="#31483f" font-weight="800">玄关：归家擦脚区</text><text x="935" y="102" font-size="14" fill="#687b70">牵引绳、擦脚巾、可洗防滑垫</text><text x="935" y="125" font-size="14" fill="#687b70">不新增玄关上下水</text></g>
  <g><circle cx="907" cy="179" r="15" fill="#5799aa"/><text x="907" y="185" text-anchor="middle" font-size="15" fill="#fff" font-weight="800">2</text><text x="935" y="182" font-size="19" fill="#31483f" font-weight="800">生活阳台：洗护收纳</text><text x="935" y="211" font-size="14" fill="#687b70">折叠洗澡盆、吹风、洗烘用品</text><text x="935" y="234" font-size="14" fill="#687b70">与洗烘动线共用，保留检修</text></g>
  <g><circle cx="907" cy="288" r="15" fill="#668f78"/><text x="907" y="294" text-anchor="middle" font-size="15" fill="#fff" font-weight="800">3</text><text x="935" y="291" font-size="19" fill="#31483f" font-weight="800">客厅：固定主狗窝</text><text x="935" y="320" font-size="14" fill="#687b70">靠近沙发、避开通道与空调直吹</text><text x="935" y="343" font-size="14" fill="#687b70">可拆洗软垫，预留约70×55cm</text></g>
  <g><circle cx="907" cy="397" r="15" fill="#558fbc"/><text x="907" y="403" text-anchor="middle" font-size="15" fill="#fff" font-weight="800">4</text><text x="935" y="400" font-size="19" fill="#31483f" font-weight="800">客厅：饮水与食盆</text><text x="935" y="429" font-size="14" fill="#687b70">远离插座与设备，垫防滑托盘</text><text x="935" y="452" font-size="14" fill="#687b70">不要与宠物睡窝紧贴摆放</text></g>
  <g><circle cx="907" cy="506" r="15" fill="#b18d54"/><text x="907" y="512" text-anchor="middle" font-size="15" fill="#fff" font-weight="800">5</text><text x="935" y="509" font-size="19" fill="#31483f" font-weight="800">南向大露台：安全休闲</text><text x="935" y="538" font-size="14" fill="#687b70">低栏杆需核实防钻出、防坠落</text><text x="935" y="561" font-size="14" fill="#687b70">遮阳、防烫、防滑；不得独处</text></g>
  <g><circle cx="907" cy="615" r="15" fill="#8f80aa"/><text x="907" y="621" text-anchor="middle" font-size="15" fill="#fff" font-weight="800">6</text><text x="935" y="618" font-size="19" fill="#31483f" font-weight="800">书房：陪伴角</text><text x="935" y="647" font-size="14" fill="#687b70">可移动小睡垫、隐藏电源线</text><text x="935" y="670" font-size="14" fill="#687b70">Mac mini/NAS远离饮水与啃咬</text></g>
  <g><circle cx="907" cy="724" r="15" fill="#c67b61"/><text x="907" y="730" text-anchor="middle" font-size="15" fill="#fff" font-weight="800">7</text><text x="935" y="727" font-size="19" fill="#31483f" font-weight="800">厨房：隔断与小狗防护</text><text x="935" y="756" font-size="14" fill="#687b70">厨房可关闭的门需核对燃气条件</text><text x="935" y="779" font-size="14" fill="#687b70">烹饪时设置可拆卸宠物安全门</text></g>
  <rect x="894" y="795" width="419" height="130" rx="16" fill="#fff5ea" stroke="#eed8bc"/>
  <text x="913" y="827" font-size="17" fill="#996638" font-weight="800">重要：三项施工前提</text>
  <text x="913" y="853" font-size="14" fill="#7a664e">① 厨房与书房隔墙性质须核实</text>
  <text x="913" y="879" font-size="14" fill="#7a664e">② 燃气厨房须向当地燃气方确认</text>
  <text x="913" y="905" font-size="14" fill="#7a664e">③ 露台防护不得擅改外立面</text>
  <text x="897" y="962" font-size="13" fill="#7b8e83">本图是功能叠加示意，不是施工图。</text>
  <text x="897" y="988" font-size="13" fill="#7b8e83">家具位置需现场复尺后再调整。</text>
  <rect x="434" y="143" width="68" height="126" rx="13" fill="none" stroke="#c67b61" stroke-width="3" stroke-dasharray="9 7"/>

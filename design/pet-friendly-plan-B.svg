  <g><circle cx="595" cy="493" r="25" fill="#558fbc" opacity=".15"/><circle cx="595" cy="493" r="16" fill="#558fbc" stroke="white" stroke-width="3"/><text x="595" y="498" font-size="16" font-weight="800" fill="white" text-anchor="middle">4</text></g>

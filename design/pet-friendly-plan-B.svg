  <g><circle cx="432" cy="251" r="25" fill="#8f80aa" opacity=".15"/><circle cx="432" cy="251" r="16" fill="#8f80aa" stroke="white" stroke-width="3"/><text x="432" y="256" font-size="16" font-weight="800" fill="white" text-anchor="middle">6</text></g>

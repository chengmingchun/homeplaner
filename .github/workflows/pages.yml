name: Publish home planner
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare website
        run: |
          mkdir -p _site/models/island-layout _site/renders/{20261108,20261108-ideal}
          cp index.html model.html model-viewer.js _site/
          cp -r vendor _site/
          cp models/island-layout/*.{glb,blend,png} _site/models/island-layout/
          cp model.html _site/planning.html
          cp model.html _site/index.backup.html
          cp model.html _site/renders/20261108/index.html
          cp model.html _site/renders/20261108-ideal/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
